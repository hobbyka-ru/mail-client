[package]
name = "yandex-mail"
version = "0.1.0"
description = "Яндекс Почта для macOS и Windows"
authors = ["Данил Артеменко"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yandex_mail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-imap = { version = "0.11.3", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
dirs = "6"
futures = "0.3"
keyring = "4.1.5"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-native-tls"] }
mail-parser = "0.11"
native-tls = "0.2"
tokio = { version = "1", features = ["net", "time"] }
tokio-native-tls = "0.3"
utf7-imap = "0.3"
